
<!doctype html>
<html lang="pt-BR">
<head>

  <title>BLUEPRINT — Encontre. Crie. Venda.</title>

  <link rel="stylesheet" href="styles.css">

<header>

<main>


<section id="home" class="screen active">

    <small>
      BLUEPRINT · PROJECT BRAIN

    <button onclick="openBuilder()">

</section>

    </p>

    ></textarea>

      </button>

      <button onclick="preset('Quero criar um sistema para uma barbearia com clientes, barbeiros, serviços, agendamento e painel administrativo.')">
        Barbearia
      </button>

      <button onclick="preset('Quero criar uma plataforma para academia com alunos, planos, pagamentos, treinos e painel administrativo.')">
        Academia
      </button>

    </div>


    <p class="cost">
      Estimativa:
      <b>7 créditos</b>
    </p>
